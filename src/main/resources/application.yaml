spring:
  application:
    name: com.RestfulAPI

  datasource:
    url: jdbc:postgresql://localhost:5332/amigos
    username: amigoscode
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true


