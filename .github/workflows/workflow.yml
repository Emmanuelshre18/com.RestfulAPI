name: Java CI - Maven (Full CICD)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: amigos
          POSTGRES_USER: amigoscode
          POSTGRES_PASSWORD: password
        ports:
          - 5332:5432
        options: >-
          --health-cmd "pg_isready -U amigoscode -d amigos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5332/amigos
      SPRING_DATASOURCE_USERNAME: amigoscode
      SPRING_DATASOURCE_PASSWORD: password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            nc -z localhost 5332 && echo "Postgres is up" && exit 0
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time" && exit 1

      - name: Build and run tests
        run: mvn -B clean verify
